name: Fetch Release
run-name: Fetch Release ${{ inputs.tag || 'latest' }}

permissions:
  contents: write

on:
  # witnsby/aws-sso-login starts this with the new tag after it publishes a
  # release. Without a tag, the latest release is used.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag of witnsby/aws-sso-login (vX.Y.Z); empty for the latest release
        required: false
        type: string
  push:
    branches:
      - main
  # Pick up new upstream releases without a manual push or dispatch.
  schedule:
    - cron: "17 6 * * *"

concurrency:
  group: fetch-release
  cancel-in-progress: false

jobs:
  get-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.23.4"

      - name: Install dependencies
        run: make install-deps

      - name: Run
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: make run

      - name: Commit and push changes
        run: |
          if git diff --quiet -- Formula/aws-sso-login.rb; then
            echo "Formula is already up to date; nothing to commit."
            exit 0
          fi
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add Formula/aws-sso-login.rb
          version="$(sed -n 's/^  version "\(.*\)"$/\1/p' Formula/aws-sso-login.rb)"
          git commit -m "Update Formula/aws-sso-login.rb to v${version} via CI/CD pipeline"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
