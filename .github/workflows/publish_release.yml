name: Fetch Release

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - main
  # Pick up new upstream releases without a manual push or dispatch.
  schedule:
    - cron: "17 6 * * *"

concurrency:
  group: fetch-release
  cancel-in-progress: false

jobs:
  get-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.4"

      - name: Install dependencies
        run: make install-deps

      - name: Run
        run: make run

      - name: Commit and push changes
        run: |
          if git diff --quiet -- Formula/aws-sso-login.rb; then
            echo "Formula is already up to date; nothing to commit."
            exit 0
          fi
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add Formula/aws-sso-login.rb
          git commit -m "Update Formula/aws-sso-login.rb via CI/CD pipeline"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
